<script>
const START="2026-09-24", END="2028-07-25", ANCHOR="2026-09-23";

/*
  설계 원칙
  - 24개 프로젝트 × 4주 = 96주
  - 한 프로젝트의 4주가 하나의 최종 일러스트로 수렴한다.
  - 모든 날에 글쓰기 + 그림 결과물이 있다.
  - 1주차: 인물/감정/말투
  - 2주차: 의상/소품/디자인
  - 3주차: 공간/행동/구도/장면
  - 4주차: 러프 → 색/빛 → 완성 → 장면 원고
  - 틈새 미션은 본 미션을 축소한 것이 아니라 별도 관찰·드로잉 훈련이다.
*/

const PROJECTS=[
{"title":"봄 축제에 나온 공주","scene":"봄 축제 시장","c":"공주","emotion":"처음 느끼는 자유와 들뜬 마음","prop":"딸기 꼬치와 작은 지갑","outfit":"가벼운 봄 외출복","support":"시장 상인","story":"궁 밖으로 몰래 나온 공주가 축제에서 처음 만난 사람과 대화하는 이야기","arcs":["궁을 빠져나와 축제에 섞이는 과정","낯선 사람과 처음 말을 섞는 순간","축제에서 작은 사건에 휘말리는 순간","해가 지기 전 다시 궁으로 돌아갈지 선택하는 순간"]},
{"title":"비를 맞고 돌아온 기사","scene":"비 내리는 성문","c":"기사","emotion":"안도와 피로, 그리고 망설임","prop":"젖은 검과 낡은 망토","outfit":"비에 젖은 갑옷","support":"성문에서 기다리던 사람","story":"전쟁터에서 돌아온 기사가 성문 앞에서 자신을 기다리던 사람을 발견하는 이야기","arcs":["폭우 속 성문에 도착하는 과정","기다리던 사람과 눈이 마주치는 순간","돌아온 이유를 숨긴 채 나누는 대화","성문 안으로 들어가기 직전의 선택"]},
{"title":"안개 숲의 엘프 궁수","scene":"새벽의 안개 숲","c":"엘프 궁수","emotion":"경계와 호기심","prop":"활과 화살통","outfit":"숲을 움직이기 편한 궁수복","support":"길 잃은 인간 아이","story":"길 잃은 아이를 발견한 엘프가 자신의 존재를 드러낼지 고민하는 이야기","arcs":["숲에서 아이의 흔적을 발견하는 과정","아이와 처음 마주치는 순간","아이를 안전한 곳으로 데려가는 과정","숲을 떠나기 전 둘이 나누는 마지막 장면"]},
{"title":"무도회를 앞둔 귀족 영애","scene":"무도회 준비실과 대연회장","c":"귀족 영애","emotion":"기대와 불안","prop":"가면과 보석 브로치","outfit":"사교계용 드레스","support":"옷을 골라주는 시녀","story":"평소와 다른 모습으로 무도회에 나타나기로 한 귀족 영애의 이야기","arcs":["무도회 전 마지막 준비","문이 열리고 연회장에 들어가는 순간","원하는 사람과 처음 마주치는 순간","무도회에서 자신의 선택을 실행하는 순간"]},
{"title":"실험을 망친 마법사","scene":"새벽의 마법 연구실","c":"젊은 마법사","emotion":"짜증과 집요한 호기심","prop":"깨진 실험병과 마법 지팡이","outfit":"연구용 로브와 앞치마","support":"졸린 연구 조수","story":"금지에 가까운 실험을 망친 마법사가 원인을 찾아 다시 시도하는 이야기","arcs":["실험 직전의 연구실","폭발 직후의 혼란","실패 원인을 추적하는 과정","다시 마법진 앞에 서는 순간"]},
{"title":"선술집에서 만난 두 기사","scene":"밤의 선술집","c":"왕국 기사","emotion":"경계와 묘한 신뢰","prop":"봉인된 편지","outfit":"평상복 위에 숨긴 경갑","support":"적국의 기사","story":"서로 적이라는 사실을 숨긴 두 기사가 같은 테이블에 앉게 되는 이야기","arcs":["서로를 알아보는 순간","같은 테이블에서 벌어지는 위장 대화","봉인된 편지를 건네는 순간","헤어지기 전 어느 쪽도 믿을 수 없는 마지막 대화"]},

{"title":"산길에서 만난 어린 용","scene":"눈 덮인 산길","c":"산길의 아이","emotion":"무서움에서 호기심으로","prop":"빨간 목도리","outfit":"두꺼운 겨울 여행복","support":"다친 어린 용","story":"산길에서 다친 어린 용을 만난 아이가 용을 도와주기로 하는 이야기","arcs":["산길에서 이상한 흔적을 발견하는 과정","눈 속에서 어린 용을 발견하는 순간","용의 상처를 치료하는 과정","둘이 함께 산을 내려가는 순간"]},

function josa(w,j){w=String(w||"");const ch=w.charCodeAt(w.length-1);if(ch<0xAC00||ch>0xD7A3)return w+j;const f=(ch-0xAC00)%28;
 if(j==="이"||j==="가")return w+(f?"이":"가");if(j==="은"||j==="는")return w+(f?"은":"는");if(j==="을"||j==="를")return w+(f?"을":"를");
 if(j==="과"||j==="와")return w+(f?"과":"와");return w+((f===0||f===8)?"로":"으로")}
function fill(s,p){
 s=String(s).replace(/\{(c|support|prop|outfit|scene|arc)\}(으로|이|가|은|는|을|를|과|와|로)/g,(m,k,j)=>josa(k==="arc"?(p.arc||""):p[k],j));
 return String(s).replace(/\{c\}/g,p.c).replace(/\{s\}/g,p.s).replace(/\{emotion\}/g,p.emotion).replace(/\{prop\}/g,p.prop).replace(/\{outfit\}/g,p.outfit).replace(/\{support\}/g,p.support).replace(/\{scene\}/g,p.scene).replace(/\{hook\}/g,p.hook).replace(/\{arc\}/g,p.arc||"");
}
function fillAny(v,p){return Array.isArray(v)?v.map(x=>fill(x,p)).join(" · "):fill(v,p)}

const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n);
return d.toISOString().slice(0,10);
}

function dateShort(d){const [,m,day]=d.split("-");return `${Number(m)}/${Number(day)}`}

const LBK="studyPlannerLastBackup";
function extraCards(d){const x=byDate(clampDate(d));let h="";
 const tot=MISSIONS.filter(m=>m.id!==0&&done[m.id]).length;let last=null;try{last=localStorage.getItem(LBK)}catch(e){}
 const gap=Math.round((new Date(todayISO()+"T12:00:00")-new Date((last||START)+"T12:00:00"))/864e5);
 if(tot>=14&&gap>=30)h+=`<div class="card" style="padding:12px 15px;font-size:12px;color:#756c63">${last?`마지막 백업이 ${gap}일 전이에요.`:"아직 백업한 적이 없어요."} 위의 💾 기록 백업에서 “파일 앱에 저장”을 한 번 눌러두면 돼요.</div>`;
 if(done[x.id])h+=`<div class="action-row"><button class="action-btn primary" id="nextBtn">다음 미션 →</button></div>`;
 if(h){main.insertAdjacentHTML("beforeend",h);const b=document.getElementById("nextBtn");if(b)b.onclick=()=>{renderToday(nextMission().date);scrollTo({top:0,behavior:"smooth"})}}}
const _rt2=renderToday;renderToday=function(d){_rt2(d);extraCards(d)};
const _eb=exportBackup;exportBackup=async function(){await _eb();try{localStorage.setItem(LBK,todayISO())}catch(e){}};
document.getElementById("backupExport").onclick=exportBackup;
const wa=document.getElementById("writingArea"),ccEl=document.getElementById("charCount");
const cc=()=>{ccEl.textContent=wa.value.length.toLocaleString()+"자 (공백 포함)"};
wa.addEventListener("input",cc);const _ow=openWriting;openWriting=function(x){_ow(x);cc()};
async function shareBackup(){try{const payload={version:1,createdAt:new Date().toISOString(),done,writing,images:await allImages()};
 const file=new File([JSON.stringify(payload)],`StudyPlanner_backup_${todayISO()}.json`,{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});try{localStorage.setItem(LBK,todayISO())}catch(e){}toast("백업을 저장했어요 ✓")}else{await exportBackup()}}
 catch(e){if(e&&e.name!=="AbortError")toast("백업에 실패했어요")}}
document.getElementById("backupShare").onclick=shareBackup;
const NK="studyPlannerName";
function applyName(){let n="";try{n=localStorage.getItem(NK)||""}catch(e){}const t=n?n+"의 스터디 플래너":"Study Planner";document.getElementById("appTitle").textContent=t+" 🎨📖";document.title=t}
document.getElementById("nameBtn").onclick=()=>{const n=prompt("앱에 표시할 이름을 입력하세요 (비우면 기본 이름)");if(n===null)return;try{localStorage.setItem(NK,n.trim())}catch(e){}applyName()};
applyName();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
heavyUI();
renderToday(nextMission().date);
</script>
</body>
</html>
