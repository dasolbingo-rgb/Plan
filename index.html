 ["감정과 주변 분위기를 맞춘다",["감정과 어울리는 빛·날씨·소리 중 2개를 고른다.","그 분위기가 보이는 배경 러프를 3장 만든다.","인물을 넣어 감정과 공간을 연결한다."],"분위기 요소 2개 + 배경 러프 3장"],
 ["감정의 끝을 그린다",["장면 마지막에 {c}가 어떤 마음으로 남는지 4문장으로 쓴다.","시작과 비교해 달라진 표정과 자세를 4장 그린다.","가장 변화가 잘 보이는 장면을 고른다."],"마지막 감정 4문장 + 비교 러프 4장"],
 ["감정 변화를 한 장면에 압축한다",["시작 감정·변화 사건·마지막 감정을 짧은 문단으로 연결한다.","세 요소가 한 화면에서 읽히도록 최종 장면 러프를 만든다."],"장면 문단 + 최종 러프 1장"]
 ]
}
];

function makePhases(p,pi){
 const mode=pi%4;
 const phaseKinds= mode===0 ? [0,1,2,3] : mode===1 ? [2,0,3,1] : mode===2 ? [3,2,1,0] : [1,3,0,2];
 return phaseKinds.map((kind,wi)=>({name:WEEK_PATTERNS[kind].name,days:WEEK_PATTERNS[kind].days.map((d,di)=>[d[0],d[1],d[2],makeMicro(p,pi,wi,di)] )}));
}
function makeMicro(p,pi,wi,di){
 const choices=[
  ["5분: {elements[0]}의 형태를 참고해 작은 구도 3개를 그린다.","10분: {prop}의 실루엣만 보고 전신 포즈 2개를 그린다.","10분: {outfit}의 특징이 보이는 상반신을 2장 그린다.","10분: {support}의 표정과 자세를 함께 그린다.","10분: {elements[1]}이 보이는 공간을 작은 화면으로 3장 그린다.","10분: {c}의 시선을 다른 방향으로 바꾼 상반신을 3장 그린다.","10분: {scene}에서 가장 먼저 보이는 형태를 찾아 작은 러프로 그린다."],
  ["10분: {prop}을 들고 있는 전신 포즈 3개를 그린다.","10분: {outfit}의 주름이 다른 방향으로 생기는 자세 3개를 그린다.","10분: {elements[2]}의 크기와 위치를 바꾼 배경 썸네일 3개를 그린다.","10분: {c}와 {support}의 키 차이가 보이는 2인 러프를 2장 그린다.","10분: 장면에 어울리는 손짓이 포함된 상반신 러프 2장을 그린다.","10분: 같은 인물을 가까운 거리와 먼 거리에서 각각 그린다.","10분: 오늘 장면의 감정이 보이는 실루엣 3개를 만든다."],
  ["10분: {elements[0]}과 {elements[1]}을 서로 다른 원근으로 배치한 공간 러프 2개.","10분: {c}의 발 위치가 다른 전신 포즈 4개.","10분: {support}가 장면을 바라보는 상반신 러프 2개.","10분: {prop}이 놓인 위치를 바꾼 화면 3개.","10분: 장면의 빛 방향만 바꿔 명암 러프 2개.","10분: {c}가 화면 안에서 더 작거나 크게 보이는 구도 2개.","10분: 장면에서 움직이는 것 3개를 찾아 간단한 선으로 표현한다."],
  ["10분: 오늘 만든 장면에서 가장 강한 표정을 상반신으로 다시 그린다.","10분: {outfit}을 입고 걷는 전신 포즈 3개.","10분: {prop}을 사용하는 손짓이 포함된 상반신 2개.","10분: {elements[3]}이 분위기를 바꾸는 작은 장면 2개.","10분: {c}의 뒷모습과 옆모습을 각각 1장씩 그린다.","10분: {support}와 마주 보는 2인 장면을 가까운 구도로 그린다.","10분: 오늘의 장면을 세로로 긴 화면과 가로 화면으로 각각 썸네일한다."]
 ];
 return fill(choices[(pi+wi)%choices.length][di],p);
}

function fill(s,p){
return String(s).replace(/\{c\}/g,p.c).replace(/\{s\}/g,p.s).replace(/\{emotion\}/g,p.emotion)
.replace(/\{prop\}/g,p.prop).replace(/\{outfit\}/g,p.outfit).replace(/\{support\}/g,p.support)
.replace(/\{scene\}/g,p.scene).replace(/\{hook\}/g,p.hook).replace(/\{elements\[0\]\}/g,p.elements[0]).replace(/\{elements\[1\]\}/g,p.elements[1]).replace(/\{elements\[2\]\}/g,p.elements[2]).replace(/\{elements\[3\]\}/g,p.elements[3]);
}
function fillAny(v,p){
return Array.isArray(v) ? v.map(x=>fill(x,p)).join(" · ") : fill(v,p);
}

function dateAdd(iso,n){
const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n);
return d.toISOString().slice(0,10);
}
function fmt(d){const [y,m,day]=d.split("-");return `${y}.${m}.${day}`}
function dateShort(d){const [,m,day]=d.split("-");return `${Number(m)}/${Number(day)}`}
function buildMissions(){
const arr=[];
let id=0;
PROJECTS.forEach((p,pi)=>{
makePhases(p,pi).forEach((phase,wi)=>{
const week=pi*4+wi+1;
phase.days.forEach((d,di)=>{
const date=dateAdd(START,id);
const title=`${p.title} · ${phase.name} · ${d[0]}`;
const taskSteps=d[1].map(x=>fill(x,p));
arr.push({
id,week,weekTitle:p.title,semester:Math.floor((week-1)/12)+1,
semesterTitle:`${Math.floor((week-1)/12)+1}학기 · ${["캐릭터와 장면","디자인과 관계","생물과 세계","공간과 서사","장면과 연출","이야기와 연출","복합 장면","포트폴리오와 창작"][Math.floor((week-1)/12)]}`,
day:di+1,date,dateShort:dateShort(date),
title,dayTitle:title,
meta:`${date} · ${di===5? "3~6시간" : di===6 ? "1~3시간" : di===0 ? "1~3시간" : "2~4시간"}`,
taskSteps,deliver:fillAny(d[2],p),micro:fillAny(d[3],p),
projectIndex:pi,phaseIndex:wi
});
id++;
});
});
});
return arr;
}
const MISSIONS=buildMissions();
const KEY="studyPlannerDone", WRITE_KEY="studyPlannerWriting";
let done={}, writing={};
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
try{writing=JSON.parse(localStorage.getItem(WRITE_KEY)||"{}")||{}}catch(e){writing={}}
function saveDone(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){toast("저장 공간이 부족해요")}}
function saveWriting(){try{localStorage.setItem(WRITE_KEY,JSON.stringify(writing))}catch(e){toast("글 저장 공간이 부족해요")}}
const DB_NAME="studyPlannerDB",DB_VERSION=1,STORE="images";
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbPut(key,value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function idbGet(key){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readonly");const r=tx.objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function idbDelete(key){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
const $=id=>document.getElementById(id), main=$("main"), datePanel=$("datePanel"), dateInput=$("dateInput"), weekList=$("weekList"), toastEl=$("toast");
const todayBtn=$("todayBtn"),dateBtn=$("dateBtn"),jumpBtn=$("jumpBtn"),backupBtn=$("backupBtn"),backdrop=$("modalBackdrop");
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const clampDate=d=>d<START?START:d>END?END:d;
const byDate=d=>MISSIONS.find(x=>x.date===d)||MISSIONS[0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
function toast(t){toastEl.textContent=t;toastEl.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>toastEl.classList.remove("show"),1300)}
function isWritingTask(s){return /(쓴다|작성|대화|문장|문장을|말투|독백|원고|설명한다|설명하|적는다|적고|정한다|고른다|고르다|원한다|원하는|생각을|이유를|감정이 바뀌|감각|소리|냄새)/.test(s)}
function writingPrompts(x){return x.taskSteps.filter(isWritingTask)}
function hasWriting(x){return writingPrompts(x).length>0}
function writingKey(x){return String(x.id)}
function renderToday(date=todayISO()){
 const x=byDate(clampDate(date)),weekDone=MISSIONS.filter(m=>m.week===x.week&&done[m.id]).length,totalDone=MISSIONS.filter(m=>done[m.id]).length;
 const prompts=writingPrompts(x),promptHtml=prompts.length?`<div class="action-row"><button class="action-btn primary" data-write="${x.id}">✍️ 글쓰기 미션 열기</button><button class="action-btn" data-photo="${x.id}">🎨 그림 기록</button></div>`:`<div class="action-row"><button class="action-btn" data-photo="${x.id}">🎨 그림 기록</button></div>`;
 const steps=x.taskSteps.map(v=>`<li>${esc(v)}</li>`).join("");
 main.innerHTML=`<section class="card today-card"><div class="kicker">W${String(x.week).padStart(2,"0")} · DAY ${x.day} · ${esc(x.semesterTitle)}</div><div class="today-date">${fmt(x.date)}</div><div class="project-label">프로젝트 · ${esc(x.weekTitle)}</div><div class="mission-title">${esc(x.dayTitle)}</div><div class="meta">${esc(x.meta)}</div><div class="block"><div class="label">오늘 할 일</div><div class="task"><ol class="task-list">${steps}</ol></div>${promptHtml}</div><div class="block"><div class="label">완료 기준</div><div class="deliver">${esc(x.deliver)}</div></div><div class="block"><div class="label">☕ 틈새 미션</div><div class="micro">${esc(x.micro)}</div></div><label class="checkrow"><input type="checkbox" id="check" ${done[x.id]?"checked":""}> 미션 완료</label><div class="progress-wrap"><div class="progress-head"><span>이번 주</span><b>${weekDone} / 7</b></div><div class="progress"><span style="width:${pct(weekDone,7)}%"></span></div><div class="progress-head" style="margin-top:10px"><span>2년 전체</span><b>${totalDone} / 672 · ${pct(totalDone,672)}%</b></div><div class="progress"><span style="width:${pct(totalDone,672)}%"></span></div></div></section>`;
 $("check").onchange=e=>{done[x.id]=e.target.checked;saveDone();renderToday(x.date);toast(e.target.checked?"완료했어요 ✓":"완료를 취소했어요")};
 main.querySelectorAll("[data-write]").forEach(b=>b.onclick=()=>openWriting(x));main.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>openPhotos(x));
}
function renderWeeks(selectedDate){
 const weeks=[...new Set(MISSIONS.map(m=>m.week))];
 weekList.innerHTML=weeks.map(w=>{const arr=MISSIONS.filter(m=>m.week===w),open=arr.some(m=>m.date===selectedDate);return `<details class="week" ${open?"open":""}><summary>W${String(w).padStart(2,"0")} · ${esc(arr[0].weekTitle)} <span style="color:var(--muted);font-size:11px">${esc(arr[0].semesterTitle)}</span></summary><div class="days">${arr.map(x=>{const steps=x.taskSteps.map(v=>`<li>${esc(v)}</li>`).join("");const btns=`<div class="action-row"><button class="action-btn" data-write="${x.id}" ${hasWriting(x)?"":"style=\"display:none\""}>✍️ 글쓰기</button><button class="action-btn" data-photo="${x.id}">🎨 그림 기록</button></div>`;return `<details class="day" ${x.date===selectedDate?"open":""}><summary><em>DAY ${x.day}</em>${x.dateShort}<b>${done[x.id]?"완료":"미완료"}</b></summary><div class="day-mission"><div class="small-mission"><div class="project-label">프로젝트 · ${esc(x.weekTitle)}</div><div class="mission-title">${esc(x.dayTitle)}</div><div class="meta">${esc(x.meta)}</div><div class="block"><div class="label">오늘 할 일</div><div class="task"><ol class="task-list">${steps}</ol></div>${btns}</div><div class="block"><div class="label">완료 기준</div><div class="deliver">${esc(x.deliver)}</div></div><div class="block"><div class="label">☕ 틈새 미션</div><div class="micro">${esc(x.micro)}</div></div></div></div></details>`}).join("")}</div></details>`}).join("");
 weekList.querySelectorAll("[data-write]").forEach(b=>{if(b.style.display!=="none")b.onclick=()=>openWriting(byDate(MISSIONS[Number(b.dataset.write)].date))});weekList.querySelectorAll("[data-photo]").forEach(b=>b.onclick=()=>openPhotos(byDate(MISSIONS[Number(b.dataset.photo)].date)));
}
function openWriting(x){const prompts=writingPrompts(x);if(!prompts.length)return;document.getElementById("writingModal").style.display="block";document.getElementById("photoModal").style.display="none";document.getElementById("backupModal").style.display="none";backdrop.classList.add("open");document.getElementById("modalTitle").textContent="✍️ 글쓰기 미션";document.getElementById("modalSub").textContent=`W${String(x.week).padStart(2,"0")} DAY ${x.day} · ${fmt(x.date)} · ${x.dayTitle}`;document.getElementById("writingPrompt").innerHTML='<b>이번 미션에서 쓸 내용</b>'+prompts.map((p,i)=>`${i+1}. ${esc(p)}`).join('<br>');document.getElementById("writingArea").value=writing[writingKey(x)]||"";document.getElementById("writingSave").onclick=()=>{writing[writingKey(x)]=document.getElementById("writingArea").value;saveWriting();closeModal();toast("글을 저장했어요 ✓")};setTimeout(()=>document.getElementById("writingArea").focus(),100)}
async function openPhotos(x){document.getElementById("writingModal").style.display="none";document.getElementById("backupModal").style.display="none";document.getElementById("photoModal").style.display="block";backdrop.classList.add("open");document.getElementById("photoSub").textContent=`W${String(x.week).padStart(2,"0")} DAY ${x.day} · ${fmt(x.date)} · ${x.dayTitle}`;backdrop.dataset.photoMission=x.id;await renderPhotos(x)}
async function renderPhotos(x){const grid=document.getElementById("photoGrid"),items=await idbGet(String(x.id));grid.innerHTML=items.map((it,i)=>`<div class="photo-item"><img src="${it.data}" alt="그림 기록 ${i+1}"><button class="photo-del" data-del="${i}">×</button></div>`).join("");grid.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const a=await idbGet(String(x.id));a.splice(Number(b.dataset.del),1);await idbPut(String(x.id),a);await renderPhotos(x);toast("사진을 삭제했어요")})}
async function compressImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);resolve({data:c.toDataURL("image/jpeg",.78),name:file.name})};img.onerror=reject;img.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
document.getElementById("photoInput").onchange=async e=>{const id=backdrop.dataset.photoMission;if(!id)return;try{const old=await idbGet(id);for(const f of [...e.target.files])old.push(await compressImage(f));await idbPut(id,old);const x=MISSIONS.find(m=>String(m.id)===String(id));await renderPhotos(x);toast("사진을 저장했어요 ✓")}catch(err){toast("사진 저장에 실패했어요") }e.target.value=""};
function closeModal(){backdrop.classList.remove("open");document.getElementById("writingModal").style.display="none";document.getElementById("photoModal").style.display="none";document.getElementById("backupModal").style.display="none"}
["modalClose","writingCancel","photoClose","backupClose"].forEach(id=>document.getElementById(id).onclick=closeModal);backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};
async function allImages(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readonly"),store=tx.objectStore(STORE),r=store.openCursor(),out={};r.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else resolve(out)};r.onerror=()=>reject(r.error)})}
function dataUrlToBlob(data){const [head,b64]=data.split(",");const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:(head.match(/:(.*?);/)||[])[1]||"image/jpeg"})}
async function exportBackup(){const payload={version:1,createdAt:new Date().toISOString(),done,writing,images:await allImages()};const blob=new Blob([JSON.stringify(payload)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`StudyPlanner_backup_${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("백업 파일을 만들었어요 ✓")}
async function importBackup(file){const payload=JSON.parse(await file.text());if(!payload||!payload.done||!payload.writing)throw new Error("invalid");done=payload.done;writing=payload.writing;saveDone();saveWriting();const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite"),st=tx.objectStore(STORE);st.clear();for(const [k,v] of Object.entries(payload.images||{}))st.put(v,k);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});closeModal();renderToday(todayISO());toast("백업을 복원했어요 ✓")}
document.getElementById("backupExport").onclick=exportBackup;document.getElementById("backupImportBtn").onclick=()=>document.getElementById("backupInput").click();document.getElementById("backupInput").onchange=async e=>{if(!e.target.files[0])return;try{if(confirm("현재 기록을 백업 파일의 기록으로 바꿀까요?"))await importBackup(e.target.files[0])}catch(err){toast("백업 파일을 읽지 못했어요")}e.target.value=""};
function openBackup(){document.getElementById("writingModal").style.display="none";document.getElementById("photoModal").style.display="none";document.getElementById("backupModal").style.display="block";backdrop.classList.add("open")}
todayBtn.onclick=()=>{renderToday(todayISO());datePanel.classList.remove("open");scrollTo({top:0,behavior:"smooth"})};
dateBtn.onclick=()=>{datePanel.classList.toggle("open");if(datePanel.classList.contains("open")){dateInput.value=clampDate(todayISO());renderWeeks(dateInput.value)}};
jumpBtn.onclick=()=>{const d=clampDate(dateInput.value||todayISO());renderToday(d);renderWeeks(d);scrollTo({top:0,behavior:"smooth"})};
dateInput.onchange=()=>renderWeeks(clampDate(dateInput.value));
backupBtn.onclick=openBackup;
renderToday(todayISO());
</script>
