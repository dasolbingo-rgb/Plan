   d.textContent=mmss(left)},200)};

let calYM=null;
function renderCal(){const now=todayISO();if(!calYM)calYM=now.slice(0,7);const [y,m]=calYM.split("-").map(Number),log=getLog();
 const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),pad=first.getDay(),iso=d=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
 const active=d=>{const e=log[d];return e&&(e.c>0||e.a)};
 let streak=0;{const t=new Date(now+"T12:00:00");if(!active(now))t.setDate(t.getDate()-1);while(true){const k=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;if(!active(k))break;streak++;t.setDate(t.getDate()-1)}}
 let inMonth=0,cells="";for(let i=0;i<pad;i++)cells+="<div class='e'></div>";
 for(let d=1;d<=days;d++){const k=iso(d),e=log[k];if(active(k))inMonth++;cells+=`<div class="${e&&e.c>0?"on":e&&e.a?"act":""} ${k===now?"today":""}">${d}</div>`}
 const total=Object.keys(log).filter(active).length;
 toolBody.innerHTML=`<div class="calnav"><button class="action-btn" id="cPrev">‹</button><b>${y}년 ${m}월</b><button class="action-btn" id="cNext">›</button></div><div class="stats"><div><b>${streak}</b>일<br><span>연속</span></div><div><b>${inMonth}</b>일<br><span>이번 달</span></div><div><b>${total}</b>일<br><span>전체</span></div></div><div class="cal">${["일","월","화","수","목","금","토"].map(n=>`<div class="h">${n}</div>`).join("")}${cells}</div><div class="hint"><span class="sw" style="background:var(--accent)"></span> 미션 완료 <span class="sw" style="background:var(--act);margin-left:10px"></span> 글·그림 기록만 함<br>실제로 공부한 날짜로 표시돼요. 이 기능을 넣은 오늘부터 기록돼요.</div>`;
 $("cPrev").onclick=()=>{const d=new Date(y,m-2,1);calYM=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;renderCal()};
 $("cNext").onclick=()=>{const d=new Date(y,m,1);calYM=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;renderCal()}}
function buildPayloadMode(){const r=document.querySelector('input[name="bmode"]:checked');return r?r.value:"all"}
function bSuffix(){return({all:"",recent:"_최근30일",text:"_글메모"})[buildPayloadMode()]}
async function buildPayload(){const mode=buildPayloadMode();let images={};
 if(mode!=="text"){const all=await allImages();if(mode==="all")images=all;else{const lim=dateAdd(todayISO(),-30);for(const [k,v] of Object.entries(all)){const m=MISSIONS[Number(k)];if(m&&m.date>=lim)images[k]=v}}}
 return{version:2,mode,createdAt:new Date().toISOString(),done,writing,notes:getNotes(),log:getLog(),steps:getAllSteps(),images}}
let curWKey=null,wTimer=null;
function flushWriting(){clearTimeout(wTimer);if(curWKey===null)return;const v=wa.value;if((writing[curWKey]||"")!==v){writing[curWKey]=v;saveWriting();if(v.trim())markActive()}}
const _ow3=openWriting;openWriting=function(x){_ow3(x);curWKey=writingKey(x)};
wa.addEventListener("input",()=>{clearTimeout(wTimer);wTimer=setTimeout(flushWriting,500)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushWriting()});

function showPage(p){main.style.display=p==="plan"?"none":"";datePanel.classList.toggle("open",p==="plan");todayBtn.classList.toggle("on",p!=="plan");dateBtn.classList.toggle("on",p==="plan");scrollTo({top:0})}

const CUK="studyPlannerCustom",CUPK="studyPlannerCustomPal";
function hsb2hex(h,s,v){s/=100;v/=100;const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return"#"+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
function mix(a,b,t){const A=hx(a),B=hx(b);return"#"+A.map((x,i)=>Math.round(x+(B[i]-x)*t).toString(16).padStart(2,"0")).join("")}
function lum(c){const [r,g,b]=hx(c).map(x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function getCustom(){try{const c=JSON.parse(localStorage.getItem(CUK)||"null");if(c&&c.bg&&c.text)return c}catch(e){}return{bg:[150,45,24],text:[140,6,96]}}
function buildPal(c){const B=c.base,eq=(a,b)=>!!(a&&b)&&a.every((x,i)=>x===b[i]);
 const bgS=!!B&&eq(c.bg,B.bgH),txS=!!B&&eq(c.text,B.txH),acS=!!B&&eq(c.accent,B.acH);
 const bg=bgS?B.bg:hsb2hex(...c.bg),tx=txS?B.text:hsb2hex(...c.text),ac=acS?B.accent:c.accent?hsb2hex(...c.accent):tx,dark=lum(bg)<lum(tx),dk=lum(bg)<.2;
 const tone=bgS?{card:B.card,soft:B.soft,line:B.line}:dk?{card:mix(bg,"#ffffff",.05),soft:mix(bg,"#ffffff",.09),line:mix(bg,"#ffffff",.16)}:{card:mix(bg,"#ffffff",.6),soft:mix(bg,"#000000",.04),line:mix(bg,"#000000",.09)};
 return{name:"내 색",bg,...tone,text:tx,muted:bgS&&txS?B.muted:mix(bg,tx,.68),accent:ac,act:bgS&&acS?B.act:mix(bg,ac,.3),dark}}
const customPal=()=>buildPal(getCustom());
function hasCustom(){try{return!!localStorage.getItem(CUK)}catch(e){return false}}
function saveCustom(c){try{localStorage.setItem(CUK,JSON.stringify(c));localStorage.setItem(CUPK,JSON.stringify(buildPal(c)))}catch(e){}}
const THK="studyPlannerTheme";
const DPK="studyPlannerDarkPal",LPK="studyPlannerLightPal";
const isDark=t=>t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(){let t="auto",dp="warm",lp="cream";try{t=localStorage.getItem(THK)||"auto";dp=localStorage.getItem(DPK)||"warm";lp=localStorage.getItem(LPK)||"cream"}catch(e){}const R=document.documentElement;if(t==="auto")delete R.dataset.theme;else R.dataset.theme=t;
 let P=isDark(t)?(DPAL[dp]||DPAL.warm):(LPAL[lp]||LPAL.cream);if(t==="custom"){P=customPal();R.dataset.theme=P.dark?"dark":"light"}
 Object.keys(P).forEach(k=>{if(k!=="name"&&k!=="dark")R.style.setProperty("--"+k,P[k])});
 document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute("content",P.bg));return t}
function palUI(){[["palRow",DPAL,DPK,"warm","다크"],["lpalRow",LPAL,LPK,"cream","라이트"]].forEach(([id,PAL,key,def,label])=>{const el=document.getElementById(id);if(!el)return;let cur=def;try{cur=localStorage.getItem(key)||def}catch(e){}
 el.innerHTML=Object.entries(PAL).map(([k,P])=>`<button class="pal ${k===cur?"on":""}" data-p="${k}"><span style="background:${P.bg}"><i style="background:${P.card};border-color:${P.line}"></i><i style="background:${P.accent}"></i></span>${P.name}</button>`).join("");
 el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{try{localStorage.setItem(key,b.dataset.p);localStorage.setItem(THK,label==="다크"?"dark":"light")}catch(e){}applyTheme();if(document.getElementById("modeRow"))renderScreen();else palUI();toast(`${label} · ${PAL[b.dataset.p].name}`)})})}
$("themeBtn").onclick=()=>{const order=["auto","dark","light"].concat(hasCustom()?["custom"]:[]),cur=applyTheme(),nx=order[(order.indexOf(cur)+1)%order.length];try{localStorage.setItem(THK,nx)}catch(e){}applyTheme();toast({auto:"화면 모드: 폰 설정 따라가기",dark:"화면 모드: 다크",light:"화면 모드: 라이트",custom:"화면 모드: 내 색"}[nx])};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
applyTheme();
function renderScreen(){let t="auto";try{t=localStorage.getItem(THK)||"auto"}catch(e){}
 toolBody.innerHTML=`<div class="label" style="margin-top:16px">화면 모드 <span style="font-weight:400">(색을 고르면 자동으로 바뀌어요)</span></div><div class="row3" id="modeRow">${[["auto","자동"],["light","라이트"],["dark","다크"],["custom","내 색"]].map(([k,n])=>`<button class="action-btn ${k===t?"primary":""}" data-m="${k}">${n}</button>`).join("")}</div><div class="label" style="margin-top:16px">라이트 모드 색</div><div class="pal-row pal6" id="lpalRow"></div><div class="label">다크 모드 색</div><div class="pal-row" id="palRow"></div><div class="label" style="margin-top:16px">내 색 만들기</div><div class="cbox" id="cbox"></div><div class="hint">색을 누르면 바로 그 색으로 바뀌어요. "자동"을 고르면 폰 설정에 따라 고른 라이트 색과 다크 색이 알아서 바뀌어요.</div>`;
 $("modeRow").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{if(b.dataset.m==="custom")saveCustom(getCustom());try{localStorage.setItem(THK,b.dataset.m)}catch(e){}applyTheme();renderScreen()});palUI();customUI()}
function previewTheme(P){const R=document.documentElement;Object.keys(P).forEach(k=>{if(k!=="name"&&k!=="dark")R.style.setProperty("--"+k,P[k])});R.dataset.theme=P.dark?"dark":"light"}
function hex2hsb(c){const [r,g,b]=hx(c).map(x=>x/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
 if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}return[h,Math.round(mx?d/mx*100:0),Math.round(mx*100)]}
function editorColors(){let t="auto",dp="warm",lp="cream";try{t=localStorage.getItem(THK)||"auto";dp=localStorage.getItem(DPK)||"warm";lp=localStorage.getItem(LPK)||"cream"}catch(e){}
 if(t==="custom"){const c=getCustom();if(!c.accent)c.accent=c.text.slice();return c}const P=isDark(t)?(DPAL[dp]||DPAL.warm):(LPAL[lp]||LPAL.cream);return{bg:hex2hsb(P.bg),text:hex2hsb(P.text),accent:hex2hsb(P.accent),base:{bgH:hex2hsb(P.bg),txH:hex2hsb(P.text),acH:hex2hsb(P.accent),bg:P.bg,text:P.text,accent:P.accent,card:P.card,line:P.line,soft:P.soft,muted:P.muted,act:P.act}}}
function customUI(){const box=$("cbox");if(!box)return;const c=editorColors();
 const grp=(key,title)=>`<div class="hsb"><div class="label" style="margin-top:4px">${title}</div>${[["색상",0,360],["채도",1,100],["밝기",2,100]].map(([n,i,max])=>`<div class="label"><span>${n}</span><span id="v_${key}${i}">${c[key][i]}</span></div><input type="range" min="0" max="${max}" value="${c[key][i]}" data-k="${key}" data-i="${i}">`).join("")}</div>`;
 box.innerHTML=`<div class="cprev" id="cPrev"><b>미리보기</b><span>오늘 할 일은 이렇게 보여요.</span><i>글쓰기 열기</i></div>${grp("bg","배경색")}${grp("text","글자색")}${grp("accent","버튼·강조색")}<div class="hint" id="cWarn"></div><div class="action-row"><button class="action-btn primary" id="cApply">내 색으로 적용</button><button class="action-btn" id="cReset">처음 값으로</button></div>`;
 const paint=live=>{const P=buildPal(c),pv=$("cPrev");pv.style.background=P.bg;pv.style.color=P.text;const bt=pv.querySelector("i");bt.style.background=P.accent;bt.style.color=P.bg;
  box.querySelectorAll("input[type=range]").forEach(r=>{const k=r.dataset.k,i=Number(r.dataset.i),[h,s2,v]=c[k];
   r.style.background=i===0?"linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)":i===1?`linear-gradient(to right,${hsb2hex(h,0,v)},${hsb2hex(h,100,v)})`:`linear-gradient(to right,#000,${hsb2hex(h,s2,100)})`;$("v_"+k+i).textContent=c[k][i]});
  const cr=contrast(P.bg,P.text);$("cWarn").textContent=cr<4.5?`글자와 배경의 차이가 작아서 읽기 힘들 수 있어요 (대비 ${cr.toFixed(1)} : 1, 4.5 이상 권장).`:`읽기 좋은 대비예요 (${cr.toFixed(1)} : 1).`;if(live)previewTheme(P)};
 box.querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{c[r.dataset.k][Number(r.dataset.i)]=Number(r.value);paint(true)});
 $("cApply").onclick=()=>{saveCustom(c);try{localStorage.setItem(THK,"custom")}catch(e){}applyTheme();renderScreen();toast("내 색을 적용했어요")};
 $("cReset").onclick=()=>{try{localStorage.removeItem(CUK)}catch(e){}const d=getCustom();c.bg=d.bg;c.text=d.text;c.accent=d.accent||d.text.slice();c.base=d.base;box.querySelectorAll("input[type=range]").forEach(r=>r.value=c[r.dataset.k][Number(r.dataset.i)]);paint(true)};
 paint()}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
heavyUI();
