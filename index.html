const todayBtn=$("todayBtn"), dateBtn=$("dateBtn"), jumpBtn=$("jumpBtn");
const fmt=d=>{const [y,m,day]=d.split("-");return `${y}.${m}.${day}`};
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const clampDate=d=>d<START?START:d>END?END:d;
const byDate=d=>MISSIONS.find(x=>x.date===d)||MISSIONS[0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
function renderToday(date=todayISO()){
 const x=byDate(clampDate(date)),weekDone=MISSIONS.filter(m=>m.week===x.week&&done[m.id]).length,totalDone=MISSIONS.filter(m=>done[m.id]).length;
 main.innerHTML=`<section class="card today-card"><div class="kicker">W${String(x.week).padStart(2,"0")} · DAY ${x.day} · ${esc(x.semesterTitle)}</div>
 <div class="today-date">${fmt(x.date)}</div><div class="mission-title">${esc(x.title)}</div><div class="meta">${fmt(x.date)} · ${esc(x.meta.split(" · ").slice(1).join(" · "))}</div>
 <div class="task">${esc(x.task).replaceAll("\n","<br>")}</div><div class="block"><div class="label">완료 기준</div><div class="deliver">${esc(x.deliver)}</div></div>
 <div class="block"><div class="label">☕ 틈새 미션</div><div class="micro">${esc(x.micro)}</div></div>
 <label class="checkrow"><input type="checkbox" id="check" ${done[x.id]?"checked":""}> 오늘 미션 완료</label>
 <div class="progress-wrap"><div class="progress-head"><span>이번 주</span><b>${weekDone} / 7</b></div><div class="progress"><span style="width:${pct(weekDone,7)}%"></span></div>
 <div class="progress-head" style="margin-top:10px"><span>2년 전체</span><b>${totalDone} / 672 · ${pct(totalDone,672)}%</b></div><div class="progress"><span style="width:${pct(totalDone,672)}%"></span></div></div></section>`;
 $("check").onchange=e=>{done[x.id]=e.target.checked;saveDone();renderToday(x.date);toast(e.target.checked?"완료했어요 ✓":"완료를 취소했어요")};
}
function renderWeeks(selectedDate){
 const weeks=[...new Set(MISSIONS.map(m=>m.week))];
 weekList.innerHTML=weeks.map(w=>{const arr=MISSIONS.filter(m=>m.week===w),open=arr.some(m=>m.date===selectedDate);
 return `<details class="week" ${open?"open":""}><summary>W${String(w).padStart(2,"0")} · ${esc(arr[0].weekTitle)} <span style="color:var(--muted);font-size:11px">${esc(arr[0].semesterTitle)}</span></summary><div class="days">
 ${arr.map(x=>`<details class="day" ${x.date===selectedDate?"open":""}><summary><em>DAY ${x.day}</em>${x.dateShort}<b>${done[x.id]?"완료":"미완료"}</b></summary><div class="day-mission"><div class="small-mission"><div class="mission-title">${esc(x.title)}</div><div class="meta">${fmt(x.date)} · ${esc(x.meta.split(" · ").slice(1).join(" · "))}</div><div class="task">${esc(x.task).replaceAll("\n","<br>")}</div><div class="block"><div class="label">완료 기준</div><div class="deliver">${esc(x.deliver)}</div></div><div class="block"><div class="label">☕ 틈새 미션</div><div class="micro">${esc(x.micro)}</div></div></div></div></details>`).join("")}
 </div></details>`}).join("");
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1400)}
todayBtn.onclick=()=>{renderToday(todayISO());datePanel.classList.remove("open");scrollTo({top:0,behavior:"smooth"})};
dateBtn.onclick=()=>{datePanel.classList.toggle("open");if(datePanel.classList.contains("open")){dateInput.value=clampDate(todayISO());renderWeeks(dateInput.value)}};
jumpBtn.onclick=()=>{const d=clampDate(dateInput.value||todayISO());renderToday(d);renderWeeks(d);scrollTo({top:0,behavior:"smooth"})};
dateInput.onchange=()=>renderWeeks(clampDate(dateInput.value));
renderToday(todayISO());
</script></body></html>
