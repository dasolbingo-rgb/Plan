<!doctype html>
<html lang="ko">
<head>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Planner">
<link rel="manifest" href="manifest.webmanifest">
<title>Study Planner</title>
<style>
:root{--bg:#f5f1ea;--card:#fffdf9;--line:#e1d9cf;--text:#292723;--muted:#827970;--soft:#eee7de;--accent:#3e352f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 15px calc(28px + env(safe-area-inset-bottom))}
header{padding:22px 0 12px}
.badge{display:inline-block;background:#e8dfd3;border-radius:99px;padding:7px 12px;font-size:12px;color:#645b50}
h1{font-size:28px;letter-spacing:-1.5px;margin:11px 0 5px}
.sub{font-size:13px;color:var(--muted);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 4px 16px #5b4d4010}
.today-card{padding:18px}
.kicker{font-size:11px;color:var(--muted);font-weight:800}
.today-date{font-size:14px;color:var(--muted);margin-top:4px}
.mission-title{font-size:22px;font-weight:900;line-height:1.35;margin:9px 0}
.meta{font-size:11px;color:#756c63;background:var(--soft);display:inline-block;padding:5px 8px;border-radius:8px}
.task{font-size:14px;line-height:1.8;margin-top:14px}
.block{border-top:1px solid #ebe4dc;margin-top:15px;padding-top:13px}
.label{font-size:11px;font-weight:900;color:#756c63;margin-bottom:5px}
.deliver,.micro{font-size:12px;line-height:1.65}
.micro{background:var(--soft);padding:10px;border-radius:11px}
.checkrow{margin-top:16px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:13px}
.checkrow input{width:23px;height:23px;accent-color:#292723}
.progress-wrap{margin-top:16px}
.progress-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.progress{height:8px;background:#e7dfd5;border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}
.navbar{position:sticky;top:0;z-index:10;background:#f5f1eaf2;backdrop-filter:blur(10px);padding:8px 0}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.navbtn{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:11px 10px;font-weight:800;color:var(--text)}
.date-panel{display:none;margin-top:10px}
.date-panel.open{display:block}
.date-row{display:flex;gap:8px;align-items:center}
.date-row input{flex:1;border:1px solid #d9d0c6;border-radius:12px;background:var(--card);padding:11px}
.jump{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 13px;font-weight:800}
.week-list{margin-top:10px}
.week{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.week>summary{padding:13px;cursor:pointer;font-weight:850;list-style:none}
.week>summary::-webkit-details-marker{display:none}
.week>summary:after{content:"＋";float:right;color:#9a8878}
.week[open]>summary:after{content:"−"}
.days{padding:0 8px 8px}
.day{border-top:1px solid #eee7df}
.day>summary{padding:11px 7px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:12px;font-weight:800}
.day>summary::-webkit-details-marker{display:none}
.day>summary b{margin-left:auto;color:var(--muted);font-weight:700}
.day>summary em{font-style:normal;font-size:9px;background:var(--accent);color:white;border-radius:99px;padding:3px 6px}
.day-mission{padding:0 2px 10px}
.small-mission{background:#fff;border:1px solid #e3dbd2;border-radius:12px;padding:13px}
.small-mission .mission-title{font-size:17px}
.small-mission .task{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#292723;color:white;padding:10px 14px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:480px){h1{font-size:25px}.mission-title{font-size:20px}.navgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header>
<span class="badge">2년 · 8학기 · 96주 · 672일</span>
<h1>Study Planner 🎨📖</h1>
<div class="sub">그림과 웹소설을 함께 훈련하는 2년 실전형 스터디 플래너</div>
</header>

<div class="navbar">
<div class="navgrid">
<button class="navbtn" id="todayBtn">✏️ 오늘 공부</button>
<button class="navbtn" id="dateBtn">🗓 날짜 선택</button>
</div>
</div>

<main id="main"></main>

<section class="card date-panel" id="datePanel">
<div class="label">원하는 날짜로 이동</div>
<div class="date-row">
<input id="dateInput" type="date" min="2026-09-23" max="2028-07-25">
<button class="jump" id="jumpBtn">보기</button>
</div>
<div class="week-list" id="weekList"></div>
</section>
</div>
<div class="toast" id="toast"></div>

const START = "2026-09-24";
const END = "2028-07-26";
const CHECK_KEY = "dasol_academy_checks_v1";

function loadChecks(){
  try{ return JSON.parse(localStorage.getItem(CHECK_KEY)||"{}"); }catch(e){ return {}; }
}
let checks = loadChecks();
function saveChecks(){ localStorage.setItem(CHECK_KEY, JSON.stringify(checks)); }

function missionByDate(date){
  return MISSIONS.find(x=>x.date===date) || MISSIONS[0];
}
function todayISO(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function clampDate(date){
  if(date<START) return START;
  if(date>END) return END;
  return date;
}
function fmt(date){
  const [y,m,d]=date.split("-");
  return `${y}년 ${Number(m)}월 ${Number(d)}일`;
}
function pct(){
  const done=Object.values(checks).filter(Boolean).length;
  return Math.round(done/MISSIONS.length*100);
}
function showToast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(showToast.t); showToast.t=setTimeout(()=>el.classList.remove("show"),1800);
}

function renderToday(date=todayISO()){
  const actual=clampDate(date);
  const x=missionByDate(actual);
  const done=!!checks[x.id];
  const weekDone=MISSIONS.filter(m=>m.week===x.week && checks[m.id]).length;
  const weekCount=MISSIONS.filter(m=>m.week===x.week).length;
  document.getElementById("main").innerHTML=`
    <section class="card today-card" id="todayCard">
      <div class="kicker">오늘 공부 · W${String(x.week).padStart(2,"0")} DAY ${x.day}</div>
      <div class="today-date">${fmt(x.date)} · ${x.weekTitle}</div>
      <div class="mission-title">${x.title}</div>
      <div class="meta">${x.meta.replace(x.date.split("-").join("."),"")}</div>
      <div class="task">${x.task}</div>
      <div class="block"><div class="label">완료 기준</div><div class="deliver">${x.deliver}</div></div>
      <div class="block"><div class="label">☕ 틈새 미션</div><div class="micro">${x.micro}</div></div>
      <label class="checkrow">
        <input type="checkbox" id="todayCheck" ${done?"checked":""}>
        오늘 미션 완료
      </label>
      <div class="progress-wrap">
        <div class="progress-head"><span>W${String(x.week).padStart(2,"0")} 진행률</span><span>${weekDone} / ${weekCount}</span></div>
        <div class="progress"><span style="width:${weekDone/weekCount*100}%"></span></div>
        <div class="progress-head" style="margin-top:10px"><span>전체 2년 과정</span><span>${pct()}%</span></div>
        <div class="progress"><span style="width:${pct()}%"></span></div>
      </div>
    </section>`;
  document.getElementById("todayCheck").addEventListener("change",e=>{
    checks[x.id]=e.target.checked; saveChecks(); renderToday(actual); showToast(e.target.checked?"완료했어요 ✓":"체크를 취소했어요");
  });
}

function renderWeeks(){
  const groups=[];
  for(let w=1;w<=96;w++){
    const ms=MISSIONS.filter(x=>x.week===w);
    const weekTitle=ms[0].weekTitle;
    const days=ms.map(x=>{
      const done=!!checks[x.id];
      return `<details class="day" data-date="${x.date}">
        <summary><span>DAY ${x.day}</span><b>${x.dateShort}</b>${done?'<em>완료</em>':''}</summary>
        <div class="day-mission"><div class="small-mission">
          <div class="kicker">W${String(x.week).padStart(2,"0")} · DAY ${x.day}</div>
          <div class="mission-title">${x.title}</div>
          <div class="meta">${x.meta}</div>
          <div class="task">${x.task}</div>
          <div class="block"><div class="label">완료 기준</div><div class="deliver">${x.deliver}</div></div>
          <div class="block"><div class="label">☕ 틈새 미션</div><div class="micro">${x.micro}</div></div>
          <label class="checkrow"><input type="checkbox" data-check="${x.id}" ${done?"checked":""}> 오늘 미션 완료</label>
        </div></div>
      </details>`;
    }).join("");
    groups.push(`<details class="week"><summary>W${String(w).padStart(2,"0")} · ${weekTitle} <small>${ms[0].dateShort}~${ms[ms.length-1].dateShort}</small></summary><div class="days">${days}</div></details>`);
  }
  document.getElementById("weekList").innerHTML=groups.join("");
  document.querySelectorAll("[data-check]").forEach(cb=>cb.addEventListener("change",e=>{
    checks[e.target.dataset.check]=e.target.checked; saveChecks(); renderWeeks(); showToast(e.target.checked?"완료했어요 ✓":"체크를 취소했어요");
  }));
}

document.getElementById("todayBtn").addEventListener("click",()=>{
  renderToday(todayISO());
  document.getElementById("datePanel").classList.remove("open");
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("dateBtn").addEventListener("click",()=>{
  const p=document.getElementById("datePanel"); p.classList.toggle("open");
  if(p.classList.contains("open")) p.scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("jumpBtn").addEventListener("click",()=>{
  const v=document.getElementById("dateInput").value;
  if(!v) return;
  renderToday(v);
  document.getElementById("datePanel").classList.remove("open");
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("dateInput").value=clampDate(todayISO());

renderToday(todayISO());
renderWeeks();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
